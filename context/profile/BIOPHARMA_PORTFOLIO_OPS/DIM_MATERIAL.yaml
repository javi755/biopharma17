  - name: MATERIAL_NAME
    type: TEXT
    distinct_count: 9
    distinct_count_source: sample
    null_count: 0
    sample_values: [2'-MOE adenosine phosphoramidite, 2'-MOE G / 5-Me-C / T phosphoramidites,
      'DNA phosphoramidites (dA, dG, dC, T)']
