unique_name: Biopharma_Portfolio_Ops
object_type: model
label: Biopharma Portfolio Ops
relationships:
  - unique_name: Cash to Date
    from:
      dataset: FACT_CASH_MONTHLY
      join_columns:
        - MONTH_DATE_KEY
    to:
      dimension: Date
      level: Day
  - unique_name: Deal Flow to Date
    from:
      dataset: FACT_DEAL_CASH_FLOW
      join_columns:
        - FLOW_DATE_KEY
    to:
      dimension: Date
      level: Day
  - unique_name: Deal Flow to Program
    from:
      dataset: FACT_DEAL_CASH_FLOW
      join_columns:
        - PROGRAM_ID
    to:
      dimension: Program
      level: Program
  - unique_name: Deal Flow to Counterparty
    from:
      dataset: FACT_DEAL_CASH_FLOW
      join_columns:
        - COUNTERPARTY_ID
    to:
      dimension: Counterparty
      level: Counterparty
  - unique_name: Deal Flow to Milestone
    from:
      dataset: FACT_DEAL_CASH_FLOW
      join_columns:
        - MILESTONE_ID
    to:
      dimension: Milestone
      level: Milestone
  - unique_name: Deal Flow to Person
    from:
      dataset: FACT_DEAL_CASH_FLOW
      join_columns:
        - OWNER_PERSON_ID
    to:
      dimension: Person
      level: Person
